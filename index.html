<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sirenity's Banana Pudding · Business Workbook</title>
<meta name="theme-color" content="#D81B7A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#D81B7A; --pink-dark:#B0145F; --pink-2:#F6C3DC; --pink-3:#FDEDF5;
  --gold:#A8742A; --gold-2:#F1DDB4; --gold-3:#FBF2E1;
  --cream:#FBF5EC; --ink:#3E2614; --muted:#76563F; --line:#EAD8C3;
  --ok:#2F7A4E; --ok-bg:#E6F4EC; --warn:#A6450A; --warn-bg:#FFF1E4; --card:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--pink-dark)}
.top{background:linear-gradient(135deg,#E3207F,#B9145F);color:#fff;padding:14px 16px 12px}
.top-in{max-width:980px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .script{font-family:"Dancing Script",cursive;font-size:30px;line-height:1;color:#FCE3A6}
.brand .bp{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:17px}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;margin-top:4px}
.save{font-size:12px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:99px}
.save.bad{background:#fff;color:var(--warn);font-weight:700}
nav.tabs{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
nav.tabs .in{max-width:980px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 8px;scrollbar-width:none}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:600 14px Inter,system-ui,sans-serif;padding:8px 12px;border-radius:99px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--pink);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 16px;box-shadow:0 1px 2px rgba(62,38,20,.05)}
.card.warn{background:var(--warn-bg);border-color:#F5CFA9}
.card.pinkish{background:var(--pink-3);border-color:var(--pink-2)}
h1{font-size:22px;margin:0 0 6px;line-height:1.25}
h2{font-size:18px;margin:0 0 10px;line-height:1.3}
h3{font-size:15px;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
ul.facts{margin:0;padding-left:18px}
ul.facts li{margin:3px 0}
input,select,textarea{font:inherit;font-size:16px;color:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;width:100%;min-height:42px}
textarea{resize:vertical;min-height:64px;line-height:1.4}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--pink-2);outline-offset:1px;border-color:var(--pink)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--pink);flex:0 0 auto}
label.q{display:block;margin:0 0 14px}
label.q>span{display:block;font-weight:600;margin-bottom:5px;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pink);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:700 15px Inter,system-ui,sans-serif;cursor:pointer;min-height:42px;text-decoration:none}
.btn:hover{background:var(--pink-dark)}
.btn.ghost{background:#fff;color:var(--pink-dark);border:1px solid var(--pink-2)}
.btn.ghost:hover{background:var(--pink-3)}
.btn.danger{background:#fff;color:var(--warn);border:1px solid #F0C29A}
.btn.x{background:transparent;color:var(--muted);border:1px solid var(--line);padding:0;width:42px;font-size:20px;line-height:1}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:3px}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.tile{background:var(--pink-3);border:1px solid var(--pink-2);border-radius:12px;padding:10px 12px}
.tile.gold{background:var(--gold-3);border-color:var(--gold-2)}
.tile.ok{background:var(--ok-bg);border-color:#BFE2CD}
.tile.bad{background:var(--warn-bg);border-color:#F5CFA9}
.tile small{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tile b{display:block;font-size:22px;line-height:1.2;margin-top:2px}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.flag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn);border:1px solid #F5CFA9}
.flag.ok{background:var(--ok-bg);color:var(--ok);border-color:#BFE2CD}
.count{font-size:13px;font-weight:600;color:var(--muted);margin-left:6px}
.steps{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.steps .btn{min-width:200px;justify-content:flex-start}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:800;border-top:2px solid var(--line)}
/* ingredient and packaging rows */
.rows{display:grid;gap:0}
.row{display:grid;gap:6px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--line)}
.row.ing{grid-template-columns:2.2fr 1fr 1fr .9fr 1fr .9fr 42px}
.row.pack{grid-template-columns:2.4fr 1fr 1fr 1fr 42px}
.row.head{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px;border-bottom:0}
.row label>span{display:none;font-size:12px;color:var(--muted);font-weight:600}
.row .out{min-height:42px;display:flex;align-items:center;justify-content:flex-end;font-weight:700;font-variant-numeric:tabular-nums}
.prod-head{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:6px}
/* pop-up tally */
.methods{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1px solid var(--pink-2);background:#fff;color:var(--pink-dark);border-radius:99px;padding:8px 14px;font:700 15px Inter,system-ui,sans-serif;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink)}
.sellgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.sell{border:0;border-radius:16px;background:var(--pink);color:#fff;padding:16px;text-align:left;cursor:pointer;font:inherit;min-height:96px}
.sell:active{transform:scale(.98)}
.sell b{display:block;font-size:19px}
.sell span{display:block;font-size:14px;opacity:.95}
.sell.out{background:#9C8B7E}
.prep{display:grid;gap:6px}
.prep label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.prep .when{flex:0 0 108px;font-weight:700;color:var(--pink-dark);font-size:14px}
.prep .past .when{color:var(--muted)}
/* orders and checklist */
.order{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;display:grid;grid-template-columns:1fr auto;gap:8px}
.order .meta{font-size:14px;color:var(--muted)}
.order .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.order .ctl select{width:auto}
.chk{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.chk-c{display:grid;grid-template-columns:130px 1fr;gap:6px}
.chk-t .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
footer{max-width:980px;margin:0 auto;padding:8px 16px 32px;color:var(--muted);font-size:13px}
.only-print{display:none}
@media (max-width:700px){
  .grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row.ing,.row.pack{grid-template-columns:1fr 1fr}
  .row.ing>label:first-child,.row.pack>label:first-child{grid-column:1 / -1}
  .row.head{display:none}
  .row label>span{display:block}
  .row .out{justify-content:flex-start}
  .prod-head{grid-template-columns:1fr 1fr}
  .prod-head>label:first-child{grid-column:1 / -1}
  .chk{grid-template-columns:1fr}
  .order{grid-template-columns:1fr}
  .order .ctl{justify-content:flex-start}
  .steps .btn{min-width:0;width:100%}
}
@media (max-width:420px){ .grid2{grid-template-columns:1fr} }
@media print{
  nav.tabs,.noprint,.save{display:none!important}
  .only-print{display:block}
  body{background:#fff;font-size:12px}
  .top{background:#fff;color:var(--ink);border-bottom:2px solid var(--pink)}
  .brand .script{color:var(--pink)}
  .card{border:1px solid #ddd;box-shadow:none;break-inside:avoid}
  main{padding:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="script">Sirenity's</span><span class="bp">Banana Pudding</span></div>

</header>

<script>
'use strict';
const KEY = 'sbp_workbook_v1';
const METHODS = ['Cash','Zelle','Chime','Apple Pay','Card','Other'];
const STATUSES = ['New','Paid','Made','Picked up','Canceled'];
const CATS = ['Ingredients','Packaging','Event fees','Licenses and permits','Equipment','Marketing','Other'];
const UNITS = ['oz','lb','g','fl oz','cup','each'];
const CHK_STATUS = ['To do','Doing','Done','N/A'];
const TABS = [['start','Start'],['interview','Questions'],['costing','Recipe costs'],['popup','Pop-up'],['orders','Orders'],['money','Money'],['checklist','Checklist'],['summary','Summary']];

/* Questions for the working session. Ids are stable: answers are stored by id. */
const QUESTIONS = [
 {g:'You and the brand', items:[

 ]},

 ]},
 {g:'The pop-up on October 28 (Powerhouse Gym, Novi)', items:[

  ['access','Who else should be able to use the app (helper, family)?']
 ]}
];

/* Launch checklist. [id, item, why, official link] */
const OAKLAND_FOOD = 'https://www.oaklandcountymi.gov/community/health/public-health-services/environmental-health/food-safety';
const CHECK = [
 {g:'Before October 28', items:[
  ['c_permit','Get your own Oakland County temporary food license for October 28 (apply by Monday, October 26 for the $87 rate)','The county says every food vendor at an event needs one; the gym\'s paperwork does not cover vendors. After two working days before the event the fee goes to $99, and $113 at the event.',OAKLAND_FOOD],
  ['c_kitchen','Make the October 28 batch in a licensed kitchen, not at home','The county will not license home-made food at an event; food made elsewhere must come from a licensed kitchen under a commissary agreement. Ask the county exactly what it needs.',OAKLAND_FOOD],
  ['c_qr','Replace the QR code on the order card with one that scans','A computer QR reader could not read the one on the flyer. A working draft is ready once the handle is confirmed.',''],

  ['c_cards','Set up a way to take cards and Apple Pay at the table','Zelle and Chime need the customer to have them. Square\'s free plan takes cards and Apple Pay by tapping on an iPhone, at 2.6% plus 15 cents a payment (Square, October 21).','https://squareup.com/us/en/payments/tap-to-pay'],
  ['c_cold','Cooler, ice packs and a food thermometer: keep cups at 41°F or colder','41°F is the cold-holding line in the FDA Food Code that Michigan follows for foods like this.',''],

  ['c_sign','Price sign that matches what you charge, and whether tax is included','',''],
  ['c_change','Cash box with change','','']
 ]},
 {g:'Set up the business', items:[
  ['b_name','Check the name is free: Michigan business entity search and a trademark search','Do this before printing more flyers or registering anything.',''],
  ['b_struct','Choose: sole proprietor with an assumed name (DBA), or an LLC','Assumed name for one person: $10 at the Oakland County Clerk, signed before a notary. LLC: $50 to form with the state, then $25 a year.','https://www.oaklandcountymi.gov/government/clerk-register-of-deeds/life-events-services/assumed-names-co-partnerships'],

 ]},
 {g:'Get legal to sell food', items:[

  ['l_tax','Register for the free Michigan sales tax license','A cup sold with a spoon counts as prepared food, taxed at 6% (Treasury bulletin RAB 2026-2).','https://www.michigan.gov/taxes/business-taxes/sales-use-tax/information/sales-tax-license-faq']
 ]},
 {g:'Online and orders', items:[
  ['o_pro','Instagram professional account; check where followers live','',''],

  ['o_rhythm','Pick a weekly rhythm: menu post, order cutoff, make day, pickup window','',''],
  ['o_thanks','Thanksgiving (Thursday, November 26) pre-order plan: dates, cutoff, tray sizes','','']
 ]}
];

/* Pop-up prep timeline: [id, days before the event, task] */
const PREP = [
 ['p1',-6,'Call the Oakland County Health Division: temporary food license, and where the pudding must be made'],
 ['p2',-5,'Book licensed kitchen time; set up card and Apple Pay at the table; print a QR code that scans'],
 ['p3',-3,'Print the price sign; get a cash box and change'],
 ['p4',-2,'Last day for the $87 temporary license rate; shop from the list on this page'],
 ['p5',-1,'Make the batches in the licensed kitchen (night before or morning of: your call, for banana freshness)'],
 ['p6',0,'Pack the cooler with ice packs and a thermometer; check cups are 41°F or colder before you leave'],
 ['p7',0,'Set up 30 minutes early; check the cooler temperature every hour'],
 ['p8',0,'After: count leftovers and money; check the tally below matches']
];

/* ---------- state ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const L = (name, unit='oz') => ({id:uid(), name, pkgPrice:'', pkgAmt:'', unit, used:''});
const P = name => ({id:uid(), name, packPrice:'', packCount:''});
const blankOrder = () => ({name:'', contact:'', date:'', time:'', items:{}, paid:false, method:'Zelle', notes:''});
const blankExpense = () => ({date:new Date().toISOString().slice(0,10), what:'', category:'Ingredients', amount:''});
function defaults(){
  const base = top => [L('Vanilla wafers or cookies'), L('Instant vanilla pudding mix'), L('Sweetened condensed milk'), L('Whipped topping or heavy cream'), L('Cream cheese'), L('Milk','fl oz'), L('Bananas','each'), ...(top ? [L('Cookie for the top','each')] : [])];
  return {
    version:1, updatedAt:null, answers:{},
    products:[
      {id:'p_reg', name:'Regular Banana Pudding', price:'7', sizeOz:'', batchYield:'', lines:base(true)},
      {id:'p_str', name:'Strawberry Banana Pudding', price:'7', sizeOz:'', batchYield:'', lines:[...base(false), L('Strawberries')]}
    ],
    packaging:[P('Cup with dome lid'), P('Spoon'), P('Label or sticker'), P('Napkin')],
    settings:{taxRate:'6', priceIncludesTax:true, cardFeePct:'', cardFeeFixed:'', cardSharePct:'', setAsidePct:'25', targetCostPct:'30'},
    event:{name:'Pop-Up Shop / Boo Bash', host:'Powerhouse Gym', date:'2026-10-28', start:'16:00', end:'19:00', address:'44125 12 Mile Rd E-123, Novi, MI 48377', fee:'', plan:{}, prep:{}, method:'Cash'},
    sales:[], orders:[], expenses:[], checklist:{},
    draftOrder:blankOrder(), draftExpense:blankExpense()
  };
}
function migrate(s){
  const d = defaults();
  if(!s || typeof s !== 'object') return d;
  for(const k of Object.keys(d)) if(s[k] == null) s[k] = d[k];
  for(const k of ['settings','event']) for(const j of Object.keys(d[k])) if(s[k][j] == null) s[k][j] = d[k][j];
  return s;
}
let S, cur = 'start';
try{ const raw = localStorage.getItem(KEY); S = raw ? migrate(JSON.parse(raw)) : defaults(); }catch(e){ S = defaults(); }

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g,'')); return Number.isFinite(n) ? n : 0; };
const has = v => String(v ?? '').trim() !== '';
const money = v => (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2);
const pc = v => (v == null || !Number.isFinite(v)) ? 'n/a' : Math.round(v) + '%';
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
function getP(path){ return path.split('.').reduce((o,k) => o == null ? undefined : o[k], S); }
function setP(path, v){ const ks = path.split('.'); let o = S; for(let i = 0; i < ks.length - 1; i++){ if(o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length-1]] = v; }
function inp(k, o = {}){
  const v = getP(k);
  return `<input type="${o.type || 'text'}" data-k="${k}"${o.num ? ' inputmode="decimal"' : ''} placeholder="${h(o.ph || '')}" value="${h(v ?? '')}"${o.aria ? ` aria-label="${h(o.aria)}"` : ''}>`;
}
function ta(k, ph = '', aria = ''){ return `<textarea data-k="${k}" rows="2" placeholder="${h(ph)}"${aria ? ` aria-label="${h(aria)}"` : ''}>${h(getP(k) ?? '')}</textarea>`; }
function sel(k, opts, aria = ''){ const v = getP(k); return `<select data-k="${k}"${aria ? ` aria-label="${h(aria)}"` : ''}>${opts.map(o => `<option${o === v ? ' selected' : ''}>${h(o)}</option>`).join('')}</select>`; }
function cb(k, label){ return `<label class="check"><input type="checkbox" data-k="${k}"${getP(k) ? ' checked' : ''}> <span>${label}</span></label>`; }
function field(label, control){ return `<label class="field"><span>${label}</span>${control}</label>`; }
function tile(label, value, cls = ''){ return `<div class="tile ${cls}"><small>${label}</small><b>${value}</b></div>`; }
function parseDate(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function fmtDay(d){ return d ? d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}) : ''; }
function fmtTime(t){ if(!t) return ''; const [hh,mm] = t.split(':').map(Number); const d = new Date(); d.setHours(hh, mm || 0, 0, 0); return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }

/* ---------- money math ---------- */
function lineCost(l){ const a = num(l.pkgAmt); return a > 0 ? num(l.pkgPrice) * num(l.used) / a : 0; }
function lineReady(l){ return !has(l.name) || (has(l.pkgPrice) && num(l.pkgAmt) > 0 && has(l.used)); }
function packCost(p){ const c = num(p.packCount); return c > 0 ? num(p.packPrice) / c : 0; }
function packReady(p){ return !has(p.name) || (has(p.packPrice) && num(p.packCount) > 0); }
function packPerCup(){ return S.packaging.reduce((s,p) => s + packCost(p), 0); }
/* What a customer pays, what is sales tax, what she keeps, and the average card fee on it.
   The fixed fee is counted once per cup, which assumes one cup per card payment (the cautious case). */
function priceParts(list){
  const r = num(S.settings.taxRate) / 100, inc = !!S.settings.priceIncludesTax;
  const charged = inc ? list : list * (1 + r);
  const net = inc ? list / (1 + r) : list;
  const fee = (charged * num(S.settings.cardFeePct) / 100 + num(S.settings.cardFeeFixed)) * num(S.settings.cardSharePct) / 100;
  return {charged, net, tax:charged - net, fee};
}
function prodCalc(p){
  const batch = p.lines.reduce((s,l) => s + lineCost(l), 0);
  const y = num(p.batchYield);
  const missing = p.lines.filter(l => !lineReady(l)).length + S.packaging.filter(x => !packReady(x)).length;
  const ing = y > 0 ? batch / y : null;
  const pack = packPerCup();
  const cost = ing == null ? null : ing + pack;
  const pp = priceParts(num(p.price));
  const profit = cost == null ? null : pp.net - pp.fee - cost;
  const margin = profit == null || pp.net <= 0 ? null : profit / pp.net * 100;
  const costPct = cost == null || pp.net <= 0 ? null : cost / pp.net * 100;
  const t = num(S.settings.targetCostPct) / 100;
  let target = null;
  if(cost != null && t > 0){ const net = cost / t; target = S.settings.priceIncludesTax ? net * (1 + num(S.settings.taxRate) / 100) : net; }
  return {batch, y, missing, ing, pack, cost, ...pp, profit, margin, costPct, target};
}
function eventCalc(){
  const rows = S.products.map(p => {
    const cups = num(S.event.plan[p.id]), y = num(p.batchYield);
    const batches = y > 0 ? Math.ceil(cups / y - 1e-9) : 0;
    return {p, cups, y, batches, made: y > 0 ? batches * y : cups, pp: priceParts(num(p.price))};
  });
  const m = new Map();
  rows.forEach(r => { if(!r.batches) return; r.p.lines.forEach(l => {
    if(!has(l.name) || !num(l.used)) return;
    const k = l.name.trim().toLowerCase() + '|' + l.unit;
    const c = m.get(k) || {name:l.name.trim(), unit:l.unit, need:0, pkgAmt:0, pkgPrice:0};
    c.need += num(l.used) * r.batches;
    if(!c.pkgAmt && num(l.pkgAmt) > 0){ c.pkgAmt = num(l.pkgAmt); c.pkgPrice = num(l.pkgPrice); }
    m.set(k, c);
  }); });
  const made = rows.reduce((s,r) => s + r.made, 0);
  const ings = [...m.values()].map(c => { const n = c.pkgAmt > 0 ? Math.ceil(c.need / c.pkgAmt - 1e-9) : null; return {...c, pkgs:n, cost: n == null ? null : n * c.pkgPrice}; });
  const packs = made > 0 ? S.packaging.filter(p => has(p.name)).map(p => { const c = num(p.packCount); const n = c > 0 ? Math.ceil(made / c - 1e-9) : null; return {name:p.name, unit:'each', need:made, pkgAmt:c, pkgs:n, cost: n == null ? null : n * num(p.packPrice)}; }) : [];
  const items = [...ings, ...packs];
  const shop = items.reduce((s,i) => s + (i.cost || 0), 0);
  const unpriced = items.filter(i => i.cost == null).length;
  const cups = rows.reduce((s,r) => s + r.cups, 0);
  const charged = rows.reduce((s,r) => s + r.cups * r.pp.charged, 0);
  const net = rows.reduce((s,r) => s + r.cups * r.pp.net, 0);
  const fees = rows.reduce((s,r) => s + r.cups * r.pp.fee, 0);
  const fee = num(S.event.fee);
  const perCup = cups > 0 ? (net - fees) / cups : 0;
  const breakeven = perCup > 0 ? Math.ceil((shop + fee) / perCup - 1e-9) : null;
  return {rows, items, shop, unpriced, cups, made, charged, net, tax:charged - net, fees, fee, profit:net - fees - shop - fee, breakeven};
}
function tally(){
  const by = {}, meth = {};
  let total = 0, count = 0;
  S.sales.forEach(s => { by[s.pid] = (by[s.pid] || 0) + s.qty; meth[s.method] = (meth[s.method] || 0) + s.qty * s.price; total += s.qty * s.price; count += s.qty; });
  return {by, meth, total, count, first:S.sales[0]?.ts, last:S.sales[S.sales.length-1]?.ts};
}
const orderTotal = o => Object.entries(o.items || {}).reduce((s,[pid,q]) => s + num(q) * num((o.prices || {})[pid]), 0);
const orderCups = o => Object.values(o.items || {}).reduce((s,q) => s + num(q), 0);
function moneyCalc(){
  const r = num(S.settings.taxRate) / 100;
  const popup = S.sales.reduce((s,x) => s + x.qty * x.price, 0);
  const orders = S.orders.filter(o => o.paid && o.status !== 'Canceled').reduce((s,o) => s + orderTotal(o), 0);
  const gross = popup + orders;
  const tax = gross - gross / (1 + r);
  const net = gross - tax;
  const fees = gross * num(S.settings.cardFeePct) / 100 * num(S.settings.cardSharePct) / 100;
  const exp = S.expenses.reduce((s,e) => s + num(e.amount), 0);
  const byCat = {};
  S.expenses.forEach(e => byCat[e.category] = (byCat[e.category] || 0) + num(e.amount));
  const profit = net - fees - exp;
  const setAside = Math.max(0, profit) * num(S.settings.setAsidePct) / 100;
  return {popup, orders, gross, tax, net, fees, exp, byCat, profit, setAside, keep:profit - setAside};
}

    if(r) r.innerHTML = e.cups ? `<div class="tw" style="margin-top:12px"><table><thead><tr><th>Item</th><th class="n">Cups to sell</th><th class="n">Cups per batch</th><th class="n">Batches</th><th class="n">Cups you will make</th></tr></thead><tbody>${e.rows.map(x => `<tr><td>${h(x.p.name)}</td><td class="n">${x.cups}</td><td class="n">${x.y || '<span class="flag">set on Recipe costs</span>'}</td><td class="n">${x.y ? x.batches : ''}</td><td class="n">${x.made}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">Enter cup counts above.</p>';
    const s = $('[data-out="evshop"]');
    if(s) s.innerHTML = e.items.length ? `<div class="tw"><table><thead><tr><th>Buy</th><th class="n">Needed</th><th class="n">Packs to buy</th><th class="n">Cost</th></tr></thead><tbody>${e.items.map(i => `<tr><td>${h(i.name)}</td><td class="n">${+i.need.toFixed(2)} ${h(i.unit)}</td><td class="n">${i.pkgs == null ? '<span class="flag">no pack size</span>' : i.pkgs}</td><td class="n">${i.cost == null ? '' : money(i.cost)}</td></tr>`).join('')}<tr class="total"><td colspan="3">Total to spend</td><td class="n">${money(e.shop)}</td></tr></tbody></table></div><p class="note">Whole packages, so you will have some left over for next time. Check your pantry before you shop.${e.unpriced ? ` <span class="flag">${plural(e.unpriced, 'item')} without pack prices</span>` : ''}</p>` : '<p class="note">Fill in Recipe costs and the cup counts above to get the list.</p>';
    const m = $('[data-out="evmoney"]');
    if(m) m.innerHTML = e.cups ? `<div class="tiles">${tile('Cups', e.cups)}${tile('Customers pay', money(e.charged))}${tile('Sales tax in it', money(e.tax))}${tile('Card fees (avg)', money(e.fees))}${tile('Shopping', money(e.shop), 'gold')}${tile('Vendor fee', money(e.fee), 'gold')}${tile('Profit if all sell', money(e.profit), e.profit > 0 ? 'ok' : 'bad')}${tile('Break-even', e.breakeven == null ? 'n/a' : plural(e.breakeven, 'cup'))}</div><p class="note">Break-even is how many cups must sell to cover the shopping and the vendor fee.</p>` : '<p class="note">Enter cup counts above.</p>';
    const t = $('[data-out="tally"]');
    if(t){
      const tl = tally();
      t.innerHTML = `
        <p class="muted">Pick how the customer paid, then tap the item. One tap is one cup.</p>
        <div class="methods" role="group" aria-label="Payment method">${METHODS.map(x => `<button class="chip" data-act="method" data-m="${h(x)}" aria-pressed="${S.event.method === x}">${h(x)}</button>`).join('')}</div>
        <div class="sellgrid">${S.products.map(p => { const sold = tl.by[p.id] || 0, brought = num(S.event.plan[p.id]); const left = brought - sold; return `<button class="sell${brought && left <= 0 ? ' out' : ''}" data-act="sell" data-pid="${p.id}"><b>${h(p.name)}</b><span>Sold ${sold}${brought ? ` · ${left > 0 ? left + ' left' : 'SOLD OUT'}` : ''}</span><span>${money(priceParts(num(p.price)).charged)} each</span></button>`; }).join('')}</div>
        <div class="tiles">${tile('Cups sold', tl.count)}${tile('Collected', money(tl.total), 'ok')}${METHODS.filter(x => tl.meth[x]).map(x => tile(h(x), money(tl.meth[x]))).join('')}</div>
        <p class="note">${tl.first ? `First sale ${new Date(tl.first).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}, last sale ${new Date(tl.last).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}.` : 'No sales yet.'}</p>
        <div class="btns"><button class="btn ghost" data-act="undoSale"${S.sales.length ? '' : ' disabled'}>Undo last tap</button><button class="btn danger" data-act="resetSales"${S.sales.length ? '' : ' disabled'}>Clear all sales</button></div>`;
    }
  }
};

PAGES.orders = {

    const o = S.draftOrder;
    const list = S.orders.map((x,i) => ({x,i})).sort((a,b) => ((a.x.date || '9') + (a.x.time || '')).localeCompare((b.x.date || '9') + (b.x.time || '')));

    const keys = Object.keys(days).sort();
    const el = $('[data-out="need"]');
    if(el) el.innerHTML = keys.length ? `<div class="tw"><table><thead><tr><th>Pickup day</th>${S.products.map(p => `<th class="n">${h(p.name)}</th>`).join('')}</tr></thead><tbody>${keys.map(k => `<tr><td>${k === 'No date' ? k : h(fmtDay(parseDate(k)))}</td>${S.products.map(p => `<td class="n">${days[k][p.id] || 0}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '<p class="note">No open orders.</p>';
  }

/* ---------- actions ---------- */
function commit(rerender){ queueSave(); if(rerender) render(); else refreshOutputs(); }
function download(name, text){
  const blob = new Blob([text], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const ACTIONS = {
  addLine(d){ S.products[+d.p].lines.push(L('')); commit(true); },
  delLine(d){ S.products[+d.p].lines.splice(+d.i, 1); commit(true); },
  addPack(){ S.packaging.push(P('')); commit(true); },
  delPack(d){ S.packaging.splice(+d.i, 1); commit(true); },
  addProduct(){ S.products.push({id:'p_' + uid(), name:'New item', price:'', sizeOz:'', batchYield:'', lines:[L('')]}); commit(true); },
  delProduct(d){
    const p = S.products[+d.p];
    if(!confirm(`Remove ${p.name || 'this item'} and its recipe?`)) return;
    S.products.splice(+d.p, 1); delete S.event.plan[p.id]; commit(true);
  },
  method(d){ S.event.method = d.m; commit(false); },
  sell(d){
    const p = S.products.find(x => x.id === d.pid); if(!p) return;
    S.sales.push({id:uid(), ts:Date.now(), pid:p.id, name:p.name, qty:1, price:priceParts(num(p.price)).charged, method:S.event.method || 'Cash'});
    if(navigator.vibrate) navigator.vibrate(30);
    commit(false);
  },
  undoSale(){ S.sales.pop(); commit(false); },
  resetSales(){ if(confirm('Clear every pop-up sale? This cannot be undone.')){ S.sales = []; commit(false); } },
  addOrder(){
    const o = S.draftOrder, hint = $('[data-out="orderhint"]');
    const items = {}; S.products.forEach(p => { const q = num(o.items[p.id]); if(q > 0) items[p.id] = q; });
    if(!has(o.name) || !Object.keys(items).length){ if(hint) hint.textContent = 'Add a name and at least one cup.'; return; }
    const prices = {}; S.products.forEach(p => prices[p.id] = priceParts(num(p.price)).charged);
    S.orders.push({id:uid(), created:new Date().toISOString(), name:o.name.trim(), contact:o.contact.trim(), date:o.date, time:o.time, items, prices, paid:!!o.paid, method:o.method, status:o.paid ? 'Paid' : 'New', notes:o.notes.trim()});
    S.draftOrder = blankOrder(); commit(true);
  },
  delOrder(d){ if(confirm('Delete this order?')){ S.orders.splice(+d.i, 1); commit(true); } },
  addExpense(){
    const e = S.draftExpense, hint = $('[data-out="exphint"]');
    if(!has(e.what) || !(num(e.amount) > 0)){ if(hint) hint.textContent = 'Add what it was and the amount.'; return; }
    S.expenses.push({id:uid(), date:e.date, what:e.what.trim(), category:e.category, amount:String(num(e.amount))});
    S.draftExpense = blankExpense(); commit(true);
  },
  delExpense(d){ if(confirm('Delete this expense?')){ S.expenses.splice(+d.i, 1); commit(true); } },
  exportJSON(){ saveNow(); download('sade_workbook_' + new Date().toISOString().slice(0,10) + '.json', JSON.stringify(S, null, 2)); },
  importJSON(){ $('#importFile').click(); },
  resetAll(){
    if(!confirm('Start over? This erases everything in this workbook on this device.')) return;
    if(!confirm('Last check: export first if you want a copy. Erase now?')) return;
    S = defaults(); saveNow(); go('start');
  },
  print(){ window.print(); }
};
$('#importFile').addEventListener('change', ev => {
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(!data || data.version !== 1 || !Array.isArray(data.products)) throw new Error('not a workbook file');
      if(!confirm('Replace what is on this device with the imported file?')) return;
      S = migrate(data); saveNow(); go('start');
    }catch(e){ alert('That file could not be loaded: ' + e.message); }
    finally{ ev.target.value = ''; }
  };
  r.readAsText(f);
});

/* ---------- wiring ---------- */
function onEdit(e){
  const el = e.target, k = el.dataset && el.dataset.k; if(!k) return;
  setP(k, el.type === 'checkbox' ? el.checked : el.value);
  if(el.tagName === 'TEXTAREA') grow(el);
  queueSave(); refreshOutputs();
}
document.addEventListener('input', onEdit);
document.addEventListener('change', e => { if(e.target.type === 'checkbox' || e.target.tagName === 'SELECT') onEdit(e); });
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]'); if(!a || a.disabled) return;
  const fn = ACTIONS[a.dataset.act]; if(fn) fn(a.dataset, a);
});
function grow(t){ t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
function refreshOutputs(){ const pg = PAGES[cur]; if(pg && pg.outputs) pg.outputs(); }
function renderTabs(){ $('#tabs').innerHTML = TABS.map(([id,label]) => `<button role="tab" aria-selected="${id === cur}" data-go="${id}">${label}</button>`).join(''); }
function render(){
  renderTabs();
  const y = window.scrollY;
  $('#view').innerHTML = PAGES[cur].render();
  document.querySelectorAll('#view textarea').forEach(grow);
  refreshOutputs();
  window.scrollTo(0, y);
}
function go(t){
  if(!PAGES[t]) t = 'start';
  cur = t;
  if(location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  render(); window.scrollTo(0, 0);
  const b = document.querySelector(`#tabs [data-go="${t}"]`); if(b) b.scrollIntoView({block:'nearest', inline:'center'});
}
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if(t !== cur && PAGES[t]) go(t); });
go(location.hash.slice(1) || 'start');
setSave(S.updatedAt ? 'Saved on this device' : 'Not saved yet', false);
</script>
