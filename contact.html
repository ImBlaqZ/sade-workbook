<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Call or email · Sirenity's Banana Pudding</title>
<style>
:root{--pink:#D81B7A;--pink-dark:#B0145F;--cream:#FBF5EC;--ink:#3E2614;--muted:#76563F;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:440px;padding:24px 16px;text-align:center}
#what{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:14px}
#num{font-size:32px;font-weight:800;margin:6px 0 20px;overflow-wrap:anywhere}
a.go{display:block;background:var(--pink);color:#fff;text-decoration:none;font-weight:800;font-size:22px;padding:20px 16px;border-radius:16px}
a.go:active{background:var(--pink-dark)}
p.note{color:var(--muted);font-size:15px;margin:16px 0 0}
p.note a{color:var(--pink-dark)}
</style>
</head>
<body>
<main>
  <div id="what">Tap to call</div>
  <div id="num"></div>
  <a class="go" id="go" href="./#contacts">Open the workbook contacts</a>
  <p class="note">Opened from Sade's business plan. Nothing is saved or sent from this page.</p>
  <p class="note"><a href="./#contacts">All contacts in the workbook</a></p>
</main>
<script>
(function () {
  var raw = decodeURIComponent(location.hash.slice(1));
  var go = document.getElementById('go'), num = document.getElementById('num'), what = document.getElementById('what');
  var m = /^tel:(\+1\d{10})(?:,(\d+))?$/.exec(raw);
  if (m) {
    var d = m[1].slice(2);
    var shown = d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) + (m[2] ? ' ext. ' + m[2] : '');
    num.textContent = shown; go.textContent = 'Call ' + shown; go.href = raw; what.textContent = 'Tap to call';
    document.title = 'Call ' + shown;
    setTimeout(function () { location.href = raw; }, 300);
    return;
  }
  m = /^mailto:([^@\s]+@[^@\s]+)$/.exec(raw);
  if (m) {
    num.textContent = m[1]; go.textContent = 'Email ' + m[1]; go.href = raw; what.textContent = 'Tap to email';
    document.title = 'Email ' + m[1];
    return;
  }
  what.textContent = 'Contacts';
})();
</script>
</body>
</html>
